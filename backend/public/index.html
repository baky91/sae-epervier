    <script>
        // Empêche le zoom au double-tap
        document.addEventListener('touchstart', function (event) {
        if (event.touches.length > 1) {
            event.preventDefault(); // Bloque le pinch-to-zoom (zoom à deux doigts)
        }
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
            event.preventDefault(); // Bloque le double-tap zoom
        }
        lastTouchEnd = now;
        }, false);
    </script>

    <!-- Script WebSocket -->
    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
        const socket = new WebSocket(`${protocol}://${window.location.host}/?clientType=player&name=AlexGamer`);

        socket.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            
            if (msg.type === "newplayer") {
                const player_id = msg.data.player_id;
                const player_name = msg.data.player_name;

                let lastEmitTime = 0;
                const EMIT_INTERVAL = 40; 
                let isMoving = false;

                const controller = new PlayerController('controller', {
                    playerNumber: player_id,
                    playerName: player_name,
                    role: 'sparrowhawk',
                    speedBonus: 0,
                    dashBonus: 2,
                    onMove: (x, y) => {
                        const now = Date.now();
                        if (x === 0 && y === 0){
                            if (isMoving){
                                socket.send(JSON.stringify({
                                    type: "move",
                                    data: { x: 0, y: 0 }
                                }));
                                isMoving = false;
                            }
                            return;
                        }

                        if (now - lastEmitTime >= EMIT_INTERVAL){
                            socket.send(JSON.stringify({
                                type: "move",
                                data: { x: x, y: y }
                            }));
                            lastEmitTime = now;
                            isMoving = true;
                        }
                    },
                    onUseSpeedBonus: () => {
                        controller.setSpeedBonus(controller.speedBonus - 1);
                        socket.send(JSON.stringify({
                            type: "use_bonus",
                            data: { bonus: "speed" }
                        }));
                    },
                    onUseDashBonus: () => {
                        controller.setDashBonus(controller.dashBonus - 1);
                        socket.send(JSON.stringify({
                            type: "use_bonus",
                            data: { bonus: "dash" }
                        }));
                    }
                });
            }
        };
    </script>
