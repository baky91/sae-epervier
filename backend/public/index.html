<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôleur de Joueur - Jeu de l'Épervier</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Conteneur principal -->
    <div id="app" class="controller-container">
        <div class="controller-wrapper">
            <div id="controller" class="controller"></div>
        </div>

    </div>

    <script>
        // Empêche le zoom au double-tap
        document.addEventListener('touchstart', function (event) {
        if (event.touches.length > 1) {
            event.preventDefault(); // Bloque le pinch-to-zoom (zoom à deux doigts)
        }
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
            event.preventDefault(); // Bloque le double-tap zoom
        }
        lastTouchEnd = now;
        }, false);
    </script>
    <script src="/js/player-controller.js"></script>
    <script src="socket.io/socket.io.js"></script>
    <script>
        const socket = io({query: {clientType: "player", name: "AlexGamer"}});

        socket.on("newplayer", (data) => {
            const player_id = data.player_id
            const player_name = data.player_name

            const controller = new PlayerController('controller', {
                playerNumber: player_id,
                playerName: player_name,
                role: 'sparrowhawk',
                speedBonus: 0,
                dashBonus: 2,

                onMove: (x, y) => console.log('Survivant se déplace:', { x, y }),
                onUseSpeedBonus: () => {
                    controller.setSpeedBonus(controller.speedBonus - 1);
                    console.log('Survivant - Bonus vitesse utilisé !');
                },
                onUseDashBonus: () => {
                    controller.setDashBonus(controller.dashBonus - 1);
                    console.log('Survivant - Bonus dash utilisé !');
                }
            });
    
            let currentInput = { x: 0, y: 0 };
    
            controller.onMove = (x, y) => {
                currentInput.x = x;
                currentInput.y = y;
            };
            
            // On envoie la donnée au serveur à intervalle régulier
            setInterval(() => {
                // On n'envoie que si le joystick n'est pas au repos
                if (currentInput.x !== 0 || currentInput.y !== 0) {
                    socket.emit("move", {
                        "player_id": player_id, 
                        "x": currentInput.x,
                        "y": currentInput.y}
                    );
                }
            }, 1000 / 30); // 30 FPS

        })



    </script>
    
</body>
</html>
