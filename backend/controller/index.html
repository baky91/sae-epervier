<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôleur de Joueur - Jeu de l'Épervier</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Conteneur principal -->
    <div id="app" class="controller-container">
        <div class="controller-wrapper">
            <div id="controller" class="controller"></div>
        </div>

    </div>

    <script>
        // Empêche le zoom au double-tap
        document.addEventListener('touchstart', function (event) {
        if (event.touches.length > 1) {
            event.preventDefault(); // Bloque le pinch-to-zoom (zoom à deux doigts)
        }
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
            event.preventDefault(); // Bloque le double-tap zoom
        }
        lastTouchEnd = now;
        }, false);
    </script>
    <script src="/js/player-controller.js"></script>
    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
        const socket = new WebSocket(`${protocol}://${window.location.host}/?clientType=player&name=AlexGamer&hostCode=ABCD`);

        let controller = null;

        socket.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            
            if (msg.type === "newplayer") {
                const player_id = msg.data.player_id;
                const player_name = msg.data.player_name;

                let lastEmitTime = 0;
                const EMIT_INTERVAL = 40;
                let isMoving = false;

                controller = new PlayerController('controller', {
                    playerNumber: player_id,
                    playerName: player_name,
                    // role: player_role,
                    onMove: (x, y) => {
                        const now = Date.now();
                        if (x === 0 && y === 0){
                            if (isMoving){
                                socket.send(JSON.stringify({
                                    type: "move",
                                    data: { x: 0, y: 0 }
                                }));
                                isMoving = false;
                            }
                            return;
                        }

                        if (now - lastEmitTime >= EMIT_INTERVAL){
                            socket.send(JSON.stringify({
                                type: "move",
                                data: { x: x, y: y }
                            }));
                            lastEmitTime = now;
                            isMoving = true;
                        }
                    },
                    onUseSpeedBonus: () => {
                        controller.setSpeedBonus(controller.speedBonus - 1);
                        socket.send(JSON.stringify({
                            type: "use_bonus",
                            data: { bonus: "speed" }
                        }));
                    },
                    onUseDashBonus: () => {
                        controller.setDashBonus(controller.dashBonus - 1);
                        socket.send(JSON.stringify({
                            type: "use_bonus",
                            data: { bonus: "dash" }
                        }));
                    }
                });
            } else if (msg.type === "bonus_obtained"){
                if(controller){
                    const bonusName = msg.data.bonus;
                    
                    controller.addBonus(bonusName);
                }
            }
        };
    </script>

</body>
</html>
