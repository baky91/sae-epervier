<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôleur de Joueur - Jeu de l'Épervier</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/controller.css">
</head>
<body>
    <div class="modal hidden">
        <form id="form-pseudo">
            <h1>Veuillez entrer votre pseudo</h1>
            <input type="text" name="player-pseudo" id="player-pseudo" placeholder="Entrez votre pseudo" autocomplete="off" required>
            <button type="submit">Valider</button>
        </form>
    </div>

    <div class="overlay hidden"></div>

    <div id="app" class="controller-container">
        <div class="controller-wrapper">
            <div id="controller" class="controller"></div>
        </div>
    </div>

    <script>
        // Empêche le zoom au double-tap
        document.addEventListener('touchstart', function (event) {
        if (event.touches.length > 1) {
            event.preventDefault(); // Bloque le pinch-to-zoom (zoom à deux doigts)
        }
        }, { passive: false });

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
            event.preventDefault(); // Bloque le double-tap zoom
        }
        lastTouchEnd = now;
        }, false);
    </script>
    <script src="/js/player-controller.js"></script>
    <script src="/js/player-socket.js"></script>

</body>
</html>
