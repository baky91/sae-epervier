<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'épervier masqué - Erreur</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/error-page.css">
</head>
<body>
    <h1>Erreur</h1>
    <div class="error-infos">
        <p id="error-message"></p>
        <p>Réessayer avec un autre code ou retournez à l'accueil.</p>
    </div>
    <main>

        <div class="left-div">
            <form id="form-code">
                <label for="game-code">Code de la partie</label>
                <input type="text" name="game-code" id="game-code" autocomplete="off" required>
                <button type="submit">Valider</button>
            </form>
        </div>

        <div class="right-div">
            <a class="go-to-home" href="/">Retour à l'accueil</a>
        </div>

    </main>

    <script>
const hostCode = window.location.pathname.split("/")[1];
const inputCode = document.getElementById("game-code");

document.getElementById("error-message").innerHTML = `
    La partie avec le code '<strong>${hostCode}</strong>' n'existe pas.
`;

document.getElementById("form-code").addEventListener("submit", (event) => {
    event.preventDefault();
    
    const hostCode = inputCode.value.toUpperCase();
    window.location.href = hostCode;
})
    </script>
</body>
</html>
