<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'épervier masqué - Erreur</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="error">
        <h1>Erreur</h1>
        <p id="error-message"></p>
        <p>Réessayer avec un autre code ou retournez à l'accueil.</p>
        <div class="error-options">
            <div class="error-option">
                <form id="form-code">
                    <input type="text" name="code" id="code" placeholder="Entrez le code d'une partie" autocomplete="off" required>
            <button type="submit">Valider</button>
                </form>
            </div>
            <div class="separator"></div>
            <div class="error-option"><a href="/">Retour à l'accueil</a></div>
        </div>
    </div>

    <script>
const hostCode = window.location.pathname.split("/")[1];
const inputCode = document.getElementById("code");

document.getElementById("error-message").innerHTML = `
    La partie avec le code '<strong>${hostCode}</strong>' n'existe pas.
`;

document.getElementById("form-code").addEventListener("submit", (event) => {
    event.preventDefault();
    
    const hostCode = inputCode.value.toUpperCase();
    window.location.href = hostCode;
})
    </script>
</body>
</html>
