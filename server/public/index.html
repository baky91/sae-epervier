<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'épervier masqué</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/main-page.css">
</head>
<body>
    <h1>L'épervier masqué - Godot</h1>
    <main>
        <div class="left-div">
            <div class="game-screen">
                <img src="./images/host-screen.png">
            </div>

            <button id="host-button"> Héberger une partie </button>

        </div>
    
        <div class="right-div">

            <div class="controller-screen">
                <img src="./images/controller-screen.png">
            </div>
            <form>
                <label for="game-code">Code de la partie</label>
                <input type="text" name="game-code" id="game-code" autocomplete="off" required>
                <button id="join-button">Rejoindre une partie</button>
            </form>

        </div>
    </main>
</body>
</html>
