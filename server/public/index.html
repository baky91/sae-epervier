<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'épervier masqué</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <h1>L'épervier masqué - Godot</h1>
    <main>
        <div name="left-div">
            <div name="game-screen">
                <a> <img src="./images/host-screen.png"> </a>
            </div>

            <button name="host-button"> Héberger une partie </button>

        </div>
    
        <div name="right-div">

            <div name="controller-screen">
                <a> <img src="./images/controller-screen.png"></a>
            </div>
            <a> Entrer code du jeu </a>
            <form action ="controllero.html">
                <input
                    type="text"
                    id="game-code"
                    minlength="4"
                    maxlength="4"
                    required
                >
    
                <button name="join-party"> Rejoindre une partie </button>
            </form>

        </div>
    </main>
</body>
</html>
