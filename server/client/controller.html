<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrôleur de Joueur - Jeu de l'Épervier</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/controller.css">
</head>
<body>
    <div class="modal hidden">
        <form id="form-pseudo">
            <label for="player-pseudo">Pseudo</label>
            <input type="text" name="player-pseudo" id="player-pseudo" autocomplete="off" placeholder="Entrez votre pseudo" required>
            <a href="/" id="go-to-home" style="background: red;">Retour</a>
            <button type="submit">Valider</button>
        </form>
    </div>

    <div class="overlay hidden"></div>

    <div id="app" class="controller-container">
        <div class="controller-wrapper">
            <div id="controller" class="controller"></div>
        </div>
    </div>

    <script type="module" src="/js/player-controller.js"></script>
    <script type="module" src="/js/player-socket.js"></script>

</body>
</html>
