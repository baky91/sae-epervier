<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<title>Epervier Masqué</title>
	<style>
		body { 
			margin: 0; 
			padding: 0; 
			background-color: #1a1a1a; 
			color: white; 
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
			overflow: hidden;
		}

		#ui-container { 
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 10px 20px; 
			background: #2a2a2a; 
			box-shadow: 0 4px 6px rgba(0,0,0,0.3);
			height: 40px;
		}

		h1 { 
			margin: 0; 
			font-size: 1.2rem; 
			color: #4CAF50; 
		}

		button { 
			padding: 8px 16px; 
			cursor: pointer; 
			background: #4CAF50; 
			color: white; 
			border: none; 
			border-radius: 4px; 
			font-weight: bold;
			transition: background 0.2s;
		}
		button:hover { 
			background: #45a049; 
		}

		#game-container { 
			display: flex; 
			justify-content: center; 
			align-items: center; 
			height: calc(100vh - 60px); 
			width: 100vw;
			background-color: #111;
			overflow: hidden;
		}
		
		canvas { 
			width: 97% !important;
			height: 97% !important;
			object-fit: contain !important;
			object-position: center !important;
			outline: none;
		}
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
	<div id="ui-container">
		<h1>L'Épervier Masqué - Écran Hôte</h1>
        <button id="fullscreen-btn">Mettre en plein écran</button>
    </div>

    <div id="game-container">
        <canvas id="canvas">
            Votre navigateur ne supporte pas le canvas HTML5.
        </canvas>
    </div>

    <script src="index.js"></script>
    <script>
        // Initialisation de Godot
        const engine = new Engine({"args":[],"canvasResizePolicy":1,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1519608,"index.wasm":37686550},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
        engine.startGame();

        // --- LOGIQUE DU PLEIN ÉCRAN ---
		const fullscreenBtn = document.getElementById('fullscreen-btn');
		const canvasElement = document.getElementById('canvas');

		fullscreenBtn.addEventListener('click', () => {
			// L'API Fullscreen change selon les navigateurs, on teste les principaux
			if (canvasElement.requestFullscreen) {
				canvasElement.requestFullscreen(); // Standard (Chrome, Edge moderne)
			} else if (canvasElement.mozRequestFullScreen) { 
				canvasElement.mozRequestFullScreen(); // Firefox
			} else if (canvasElement.webkitRequestFullscreen) { 
				canvasElement.webkitRequestFullscreen(); // Safari et vieux Chrome
			} else if (canvasElement.msRequestFullscreen) { 
				canvasElement.msRequestFullscreen(); // Internet Explorer
			}
		});
	</script>
</body>
</html>
